<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrar Catálogo | Pijamados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #1d4ed8;
    --green: #10b981;
    --green-dark: #059669;
    --red: #ef4444;
    --border: #e2e8f0;
    --blue-chip: #dbeafe;
    --blue-chip-text: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 60px;
  }
  header {
    background: var(--accent);
    color: white;
    padding: 28px 20px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
  header p { margin: 6px 0 0; color: #bfdbfe; font-size: 0.9rem; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 18px; }

  #loginBox {
    max-width: 360px; margin: 80px auto; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 36px 28px;
  }
  #loginBox h2 { margin: 0 0 6px; font-size: 1.2rem; }
  #loginBox p { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }

  input, textarea, select {
    width: 100%; font-family: inherit; font-size: 1rem;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button {
    font-family: inherit; font-weight: 600; font-size: 1rem;
    border: none; border-radius: 10px; cursor: pointer;
    padding: 13px 18px; width: 100%;
  }
  .btn-primary { background: var(--green); color: white; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:disabled { background: #a7f3d0; cursor: not-allowed; }
  .btn-secundario { background: var(--accent); color: white; }
  .btn-secundario:hover { background: #1e40af; }
  .btn-danger { background: #fee2e2; color: #991b1b; width: auto; padding: 8px 14px; font-size: 0.85rem; }
  .btn-danger:hover { background: #fecaca; }
  .btn-no { background: #f1f5f9; color: var(--muted); width: auto; padding: 8px 14px; font-size: 0.85rem; }
  .btn-no:hover { background: #e2e8f0; }
  .acciones { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .confirmar-texto { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  #avisoLista { font-size: 0.9rem; padding: 0; border-radius: 8px; margin-bottom: 12px; }
  #avisoLista.ok { background: #d1fae5; color: #065f46; padding: 10px 12px; }
  #avisoLista.error { background: #fee2e2; color: #991b1b; padding: 10px 12px; }

  section.card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; margin-bottom: 22px;
  }
  section.card h2 { margin: 0 0 16px; font-size: 1.05rem; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

  .talles-grid {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .talle-opcion {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
    background: var(--card);
  }
  .talle-opcion input { width: 18px; height: 18px; accent-color: var(--accent); }
  .talle-opcion:has(input:checked) { background: var(--blue-chip); border-color: var(--accent); color: var(--blue-chip-text); }

  #estadoAgregar, #estadoEditar { margin-top: 12px; font-size: 0.9rem; display: none; padding: 10px 12px; border-radius: 8px; }
  .ok { background: #d1fae5; color: #065f46; display: block !important; }
  .error { background: #fee2e2; color: #991b1b; display: block !important; }

  .producto-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .producto-row:last-child { border-bottom: none; }
  .producto-row img {
    width: 56px; height: 56px; object-fit: contain; background: #f1f5f9;
    border-radius: 8px; flex-shrink: 0;
  }
  .producto-info { flex-grow: 1; min-width: 0; }
  .producto-info .nombre { font-weight: 600; font-size: 0.95rem; }
  .producto-info .precio { color: var(--green-dark); font-size: 0.85rem; font-weight: 600; }
  .producto-info .talles-resumen { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  .chk-producto, .chk-todos {
    width: 22px; height: 22px; flex-shrink: 0; cursor: pointer; accent-color: var(--green);
  }

  .barra-seleccion {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .barra-seleccion label {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.85rem; color: var(--muted); font-weight: 600; margin: 0;
  }
  #btnEliminarSeleccion {
    width: auto; background: var(--red); color: white;
    padding: 9px 16px; font-size: 0.85rem;
  }
  #btnEliminarSeleccion:hover { background: #dc2626; }
  #btnEliminarSeleccion:disabled { background: #fca5a5; cursor: not-allowed; }

  #listaEstado { color: var(--muted); font-size: 0.9rem; }

  .panel-edicion {
    display: none; padding: 14px 0 4px; border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .panel-edicion.abierto { display: block; }
  .panel-edicion .acciones-editar { display: flex; gap: 8px; margin-top: 6px; }
  .panel-edicion .acciones-editar button { width: auto; padding: 10px 16px; font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>Administrar Catálogo</h1>
  <p>Pijamados — agregar, editar y eliminar pijamas</p>
</header>

<div id="loginBox">
  <h2>Ingresá la clave</h2>
  <p>Es la clave del panel de administración.</p>
  <div class="field">
    <input type="password" id="passwordInput" placeholder="Clave">
  </div>
  <button class="btn-primary" id="btnEntrar">Entrar</button>
  <div id="loginError" style="color:#991b1b; font-size:0.85rem; margin-top:10px;"></div>
</div>

<div class="wrap" id="panel" style="display:none;">

  <div style="text-align:right; margin-bottom:10px;">
    <button id="btnSalir" style="width:auto; background:none; color:var(--muted); font-size:0.85rem; padding:6px 10px; text-decoration:underline;">Cerrar sesión</button>
  </div>

  <section class="card">
    <h2>➕ Agregar pijama nuevo</h2>
    <div class="field">
      <label for="nombre">Nombre del pijama</label>
      <input type="text" id="nombre" placeholder="Ej: Pijama Dino manga larga">
    </div>
    <div class="field">
      <label for="precio">Precio</label>
      <input type="text" id="precio" placeholder="Ej: 15000 o Consultar">
    </div>
    <div class="field">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" rows="2" placeholder="Ej: Algodón, manga larga, estampa de dinosaurios"></textarea>
    </div>
    <div class="field">
      <label for="categoria">Género</label>
      <select id="categoria">
        <option value="varon">Varón</option>
        <option value="mujer">Mujer</option>
      </select>
    </div>
    <div class="field">
      <label>Talles disponibles</label>
      <div class="talles-grid" id="tallesAgregar"></div>
    </div>
    <div class="field">
      <label for="foto">Foto del pijama</label>
      <input type="file" id="foto" accept="image/*">
    </div>
    <button class="btn-primary" id="btnAgregar">Guardar y publicar</button>
    <div id="estadoAgregar"></div>
  </section>

  <section class="card">
    <h2>📋 Pijamas actuales</h2>
    <p style="color:var(--muted); font-size:0.85rem; margin-top:-8px;">Tocá un pijama para editar sus talles, precio o descripción.</p>
    <div id="avisoLista"></div>
    <div id="listaEstado">Cargando...</div>
    <div class="barra-seleccion" id="barraSeleccion" style="display:none;">
      <label><input type="checkbox" class="chk-todos" id="chkTodos"> Seleccionar todos</label>
      <button id="btnEliminarSeleccion" disabled>Eliminar seleccionados</button>
    </div>
    <div id="listaProductos"></div>
  </section>

</div>

<script>
  // ⚠️ Pegá aquí la URL de tu Worker de Cloudflare
  const WORKER_URL = "https://pijamados-api.TU-USUARIO.workers.dev";

  const CATALOGO_URL = "../products.json"; // products.json vive un nivel arriba (raíz del sitio)
  const IMG_BASE = "../img/";
  const TALLES_DISPONIBLES = ["6", "8", "10", "12", "14", "16"];

  let clave = "";
  const CLAVE_GUARDADA = "pijamados_admin_clave";

  const loginBox = document.getElementById("loginBox");
  const panel = document.getElementById("panel");
  const passwordInput = document.getElementById("passwordInput");
  const loginError = document.getElementById("loginError");
  const btnEntrar = document.getElementById("btnEntrar");

  function crearCheckboxesTalle(contenedor, idPrefijo, marcados = []) {
    contenedor.innerHTML = "";
    TALLES_DISPONIBLES.forEach((t) => {
      const label = document.createElement("label");
      label.className = "talle-opcion";
      label.innerHTML = `<input type="checkbox" value="${t}" id="${idPrefijo}-${t}" ${marcados.map(String).includes(t) ? "checked" : ""}> ${t}`;
      contenedor.appendChild(label);
    });
  }

  function leerTallesMarcados(contenedor) {
    return [...contenedor.querySelectorAll("input[type=checkbox]:checked")].map((c) => c.value);
  }

  crearCheckboxesTalle(document.getElementById("tallesAgregar"), "add");

  async function verificarClave(intento) {
    try {
      const resp = await fetch(WORKER_URL + "/verificar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: intento }),
      });
      return resp.ok;
    } catch (e) {
      loginError.textContent = "No se pudo conectar con el servidor. Revisá tu conexión.";
      return false;
    }
  }

  function entrarAlPanel() {
    loginBox.style.display = "none";
    panel.style.display = "block";
    cargarProductos();
  }

  async function intentarEntrar() {
    const intento = passwordInput.value.trim();
    if (!intento) { loginError.textContent = "Escribí la clave."; return; }
    loginError.textContent = "";
    btnEntrar.disabled = true;
    btnEntrar.textContent = "Verificando...";

    const ok = await verificarClave(intento);

    btnEntrar.disabled = false;
    btnEntrar.textContent = "Entrar";

    if (!ok) {
      loginError.textContent = "Clave incorrecta.";
      return;
    }
    clave = intento;
    localStorage.setItem(CLAVE_GUARDADA, clave);
    entrarAlPanel();
  }

  btnEntrar.onclick = intentarEntrar;
  passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") intentarEntrar();
  });

  document.getElementById("btnSalir").onclick = () => {
    localStorage.removeItem(CLAVE_GUARDADA);
    clave = "";
    passwordInput.value = "";
    panel.style.display = "none";
    loginBox.style.display = "block";
  };

  (async () => {
    const guardada = localStorage.getItem(CLAVE_GUARDADA);
    if (guardada) {
      const ok = await verificarClave(guardada);
      if (ok) {
        clave = guardada;
        entrarAlPanel();
      } else {
        localStorage.removeItem(CLAVE_GUARDADA);
      }
    }
  })();

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("btnAgregar").onclick = async () => {
    const nombre = document.getElementById("nombre").value.trim();
    const precio = document.getElementById("precio").value.trim();
    const descripcion = document.getElementById("descripcion").value.trim();
    const categoria = document.getElementById("categoria").value;
    const talles = leerTallesMarcados(document.getElementById("tallesAgregar"));
    const fotoInput = document.getElementById("foto");
    const estado = document.getElementById("estadoAgregar");
    const boton = document.getElementById("btnAgregar");

    estado.className = ""; estado.style.display = "none";

    if (!nombre || !precio || !fotoInput.files[0]) {
      estado.textContent = "Completá nombre, precio y elegí una foto.";
      estado.className = "error";
      return;
    }

    boton.disabled = true;
    boton.textContent = "Guardando...";

    try {
      const archivo = fotoInput.files[0];
      const imagenBase64 = await fileToBase64(archivo);
      const ext = archivo.name.split(".").pop();

      const resp = await fetch(WORKER_URL + "/agregar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: clave, nombre, precio, descripcion, categoria, talles, imagenBase64, imagenExt: ext }),
      });
      const data = await resp.json();

      if (!resp.ok) throw new Error(data.error || "Error desconocido");

      estado.textContent = "¡Pijama agregado y publicado! Puede demorar 1 minuto en verse en la web.";
      estado.className = "ok";
      document.getElementById("nombre").value = "";
      document.getElementById("precio").value = "";
      document.getElementById("descripcion").value = "";
      fotoInput.value = "";
      crearCheckboxesTalle(document.getElementById("tallesAgregar"), "add");
      cargarProductos();
    } catch (e) {
      estado.textContent = "No se pudo guardar: " + e.message;
      estado.className = "error";
    } finally {
      boton.disabled = false;
      boton.textContent = "Guardar y publicar";
    }
  };

  const seleccionados = new Set();
  const barraSeleccion = document.getElementById("barraSeleccion");
  const chkTodos = document.getElementById("chkTodos");
  const btnEliminarSeleccion = document.getElementById("btnEliminarSeleccion");

  function actualizarBarraSeleccion(totalFilas) {
    btnEliminarSeleccion.disabled = seleccionados.size === 0;
    btnEliminarSeleccion.textContent = seleccionados.size > 0
      ? `Eliminar seleccionados (${seleccionados.size})`
      : "Eliminar seleccionados";
    chkTodos.checked = totalFilas > 0 && seleccionados.size === totalFilas;
    chkTodos.indeterminate = seleccionados.size > 0 && seleccionados.size < totalFilas;
  }

  let productosCache = [];

  async function cargarProductos() {
    const listaEstado = document.getElementById("listaEstado");
    const listaProductos = document.getElementById("listaProductos");
    listaEstado.textContent = "Cargando...";
    mostrarAvisoLista("", "");
    listaProductos.innerHTML = "";
    seleccionados.clear();
    barraSeleccion.style.display = "none";

    try {
      const resp = await fetch(CATALOGO_URL + "?t=" + Date.now());
      const productos = await resp.json();
      productosCache = productos;

      if (productos.length === 0) {
        listaEstado.textContent = "No hay pijamas cargados todavía.";
        return;
      }
      listaEstado.textContent = "";
      barraSeleccion.style.display = "flex";

      productos.forEach((p) => {
        const row = document.createElement("div");
        row.className = "producto-row";

        const precioTexto = String(p.precio ?? "").trim().startsWith("$")
          ? String(p.precio).trim()
          : "$" + String(p.precio ?? "");
        const generoTexto = p.categoria === "mujer" ? "Mujer" : p.categoria === "varon" ? "Varón" : (p.categoria || "sin género");
        const tallesTexto = Array.isArray(p.talles) && p.talles.length ? "Talles: " + p.talles.join(", ") : "Sin talles marcados";

        row.innerHTML = `
          <input type="checkbox" class="chk-producto">
          <img src="${IMG_BASE}${p.imagen}" onerror="this.style.opacity=0.2">
          <div class="producto-info">
            <div class="nombre">${p.nombre} <span style="color:var(--muted); font-weight:400; font-size:0.8rem;">(${generoTexto})</span></div>
            <div class="precio">${precioTexto}</div>
            <div class="talles-resumen">${tallesTexto}</div>
          </div>
        `;

        const chk = row.querySelector(".chk-producto");
        chk.onchange = (e) => {
          e.stopPropagation();
          if (chk.checked) seleccionados.add(p.imagen);
          else seleccionados.delete(p.imagen);
          actualizarBarraSeleccion(listaProductos.querySelectorAll(".chk-producto").length);
        };
        chk.onclick = (e) => e.stopPropagation();

        row.dataset.imagen = p.imagen;
        row.onclick = () => abrirPanelEdicion(p, row);
        listaProductos.appendChild(row);

        const panelEdicion = document.createElement("div");
        panelEdicion.className = "panel-edicion";
        panelEdicion.dataset.imagenEdicion = p.imagen;
        panelEdicion.innerHTML = `
          <div class="field">
            <label>Nombre</label>
            <input type="text" class="edit-nombre" value="${(p.nombre || "").replace(/"/g, '&quot;')}">
          </div>
          <div class="field">
            <label>Precio</label>
            <input type="text" class="edit-precio" value="${p.precio ?? ""}">
          </div>
          <div class="field">
            <label>Descripción</label>
            <textarea class="edit-descripcion" rows="2">${p.descripcion || ""}</textarea>
          </div>
          <div class="field">
            <label>Género</label>
            <select class="edit-categoria">
              <option value="varon" ${p.categoria === "varon" ? "selected" : ""}>Varón</option>
              <option value="mujer" ${p.categoria === "mujer" ? "selected" : ""}>Mujer</option>
            </select>
          </div>
          <div class="field">
            <label>Talles disponibles</label>
            <div class="talles-grid edit-talles"></div>
          </div>
          <div id="estadoEditar-${CSS.escape(p.imagen)}"></div>
          <div class="acciones-editar">
            <button class="btn-secundario btn-guardar-edicion">Guardar cambios</button>
            <button class="btn-no btn-cerrar-edicion" type="button">Cerrar</button>
          </div>
        `;
        crearCheckboxesTalle(panelEdicion.querySelector(".edit-talles"), "edit-" + p.imagen, p.talles || []);
        listaProductos.appendChild(panelEdicion);

        panelEdicion.querySelector(".btn-cerrar-edicion").onclick = () => panelEdicion.classList.remove("abierto");
        panelEdicion.querySelector(".btn-guardar-edicion").onclick = () => guardarEdicion(p.imagen, panelEdicion);
      });

      actualizarBarraSeleccion(productos.length);
    } catch (e) {
      listaEstado.textContent = "No se pudo cargar el catálogo: " + e.message;
    }
  }

  function abrirPanelEdicion(producto, row) {
    const panelEdicion = row.nextElementSibling;
    if (!panelEdicion || panelEdicion.dataset.imagenEdicion !== producto.imagen) return;
    document.querySelectorAll(".panel-edicion.abierto").forEach((p) => {
      if (p !== panelEdicion) p.classList.remove("abierto");
    });
    panelEdicion.classList.toggle("abierto");
  }

  async function guardarEdicion(imagen, panelEdicion) {
    const boton = panelEdicion.querySelector(".btn-guardar-edicion");
    const estado = document.getElementById(`estadoEditar-${CSS.escape(imagen)}`);
    estado.className = ""; estado.style.display = "none";

    const nombre = panelEdicion.querySelector(".edit-nombre").value.trim();
    const precio = panelEdicion.querySelector(".edit-precio").value.trim();
    const descripcion = panelEdicion.querySelector(".edit-descripcion").value.trim();
    const categoria = panelEdicion.querySelector(".edit-categoria").value;
    const talles = leerTallesMarcados(panelEdicion.querySelector(".edit-talles"));

    if (!nombre || !precio) {
      estado.textContent = "Completá al menos nombre y precio.";
      estado.className = "error";
      return;
    }

    boton.disabled = true;
    boton.textContent = "Guardando...";

    try {
      const resp = await fetch(WORKER_URL + "/editar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: clave, imagen, nombre, precio, descripcion, categoria, talles }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Error desconocido");

      estado.textContent = "¡Cambios guardados! Puede demorar 1 minuto en verse en la web.";
      estado.className = "ok";
      setTimeout(() => cargarProductos(), 900);
    } catch (e) {
      estado.textContent = "No se pudo guardar: " + e.message;
      estado.className = "error";
    } finally {
      boton.disabled = false;
      boton.textContent = "Guardar cambios";
    }
  }

  chkTodos.onchange = () => {
    const filas = document.querySelectorAll("#listaProductos .producto-row");
    filas.forEach((row) => {
      const chk = row.querySelector(".chk-producto");
      chk.checked = chkTodos.checked;
      if (chkTodos.checked) seleccionados.add(row.dataset.imagen);
      else seleccionados.delete(row.dataset.imagen);
    });
    actualizarBarraSeleccion(filas.length);
  };

  btnEliminarSeleccion.onclick = () => {
    if (seleccionados.size === 0) return;

    if (btnEliminarSeleccion.textContent.startsWith("¿Seguro")) {
      eliminarSeleccionados();
      return;
    }

    const cantidadOriginal = seleccionados.size;
    btnEliminarSeleccion.textContent = `¿Seguro? Tocá de nuevo para eliminar ${cantidadOriginal}`;
    setTimeout(() => {
      if (btnEliminarSeleccion.textContent.startsWith("¿Seguro")) {
        actualizarBarraSeleccion(document.querySelectorAll("#listaProductos .producto-row").length);
      }
    }, 4000);
  };

  async function eliminarSeleccionados() {
    const imagenes = [...seleccionados];
    btnEliminarSeleccion.disabled = true;
    chkTodos.disabled = true;

    let hechos = 0;
    let fallidos = [];

    for (const imagen of imagenes) {
      btnEliminarSeleccion.textContent = `Eliminando ${hechos + 1} de ${imagenes.length}...`;
      try {
        const controlador = new AbortController();
        const corte = setTimeout(() => controlador.abort(), 20000);

        const resp = await fetch(WORKER_URL + "/eliminar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: clave, imagen }),
          signal: controlador.signal,
        });
        clearTimeout(corte);

        let data = {};
        try { data = await resp.json(); } catch (_) {}
        if (!resp.ok) throw new Error(data.error || ("El servidor respondió " + resp.status));

        const fila = document.querySelector(`#listaProductos .producto-row[data-imagen="${CSS.escape(imagen)}"]`);
        const panelEdicion = fila ? fila.nextElementSibling : null;
        if (panelEdicion) panelEdicion.remove();
        if (fila) fila.remove();
        seleccionados.delete(imagen);
        hechos++;
      } catch (e) {
        const motivo = e.name === "AbortError" ? "el servidor tardó demasiado" : e.message;
        fallidos.push(motivo);
      }
    }

    chkTodos.disabled = false;

    if (fallidos.length === 0) {
      mostrarAvisoLista(`${hechos} producto(s) eliminado(s). La web puede tardar hasta 1 minuto en actualizarse.`, "ok");
    } else {
      mostrarAvisoLista(`Se eliminaron ${hechos}. Hubo ${fallidos.length} error(es): ${fallidos[0]}`, "error");
    }

    const filasRestantes = document.querySelectorAll("#listaProductos .producto-row").length;
    if (filasRestantes === 0) {
      barraSeleccion.style.display = "none";
      document.getElementById("listaEstado").textContent = "No hay pijamas cargados todavía.";
    } else {
      actualizarBarraSeleccion(filasRestantes);
    }
  }

  function mostrarAvisoLista(texto, tipo) {
    const aviso = document.getElementById("avisoLista");
    aviso.textContent = texto;
    aviso.className = tipo;
  }

</script>

</body>
</html>
