  <a href="#/"><img id="logo" src="pijamados.png" alt="Pijamados"></a>
  <div class="hd">
    <a class="ig" href="https://www.instagram.com/pijamadosok" target="_blank" rel="noopener" aria-label="Instagram"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.3" fill="currentColor"/></svg></a>
    <a class="btn" id="navWa" target="_blank" rel="noopener" style="padding:9px 20px;font-size:.92rem">WhatsApp</a>
  </div>
</header>

<main id="home">
  <div class="hero">
    <svg class="st s1" viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8l-6.4 3.7 1.7-7.2L2 9.6 9 9z"/></svg>
    <svg class="st s2" viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8l-6.4 3.7 1.7-7.2L2 9.6 9 9z"/></svg>
    <svg class="st s3" viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8l-6.4 3.7 1.7-7.2L2 9.6 9 9z"/></svg>
    <svg class="st s4" viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8l-6.4 3.7 1.7-7.2L2 9.6 9 9z"/></svg>
    <svg class="dec nube" viewBox="0 0 64 40"><path fill="#fff" d="M14 38a12 12 0 0 1-1-24 16 16 0 0 1 30-3 13 13 0 0 1 8 27z"/></svg>
    <svg class="dec nube n2" viewBox="0 0 64 40"><path fill="#fff" d="M14 38a12 12 0 0 1-1-24 16 16 0 0 1 30-3 13 13 0 0 1 8 27z"/></svg>
    <svg class="dec luna" viewBox="0 0 24 24"><path fill="#fde047" stroke="#b45309" stroke-width=".6" d="M20 12a8 8 0 1 1-8-8 6 6 0 0 0 8 8z"/><circle cx="10" cy="14" r="1" fill="#f59e0b"/><circle cx="13.5" cy="17" r=".7" fill="#f59e0b"/></svg>
    <svg class="dec glo" viewBox="0 0 24 30"><ellipse cx="12" cy="11" rx="9" ry="10" fill="#ef4444"/><path d="M12 21l-2 3h4z" fill="#ef4444"/><path d="M12 24q-3 3 0 6" fill="none" stroke="#fff" stroke-width="1"/><ellipse cx="8" cy="7" rx="2" ry="3" fill="#fff" opacity=".5"/></svg>
    <svg class="dec glo g2" viewBox="0 0 24 30"><ellipse cx="12" cy="11" rx="9" ry="10" fill="#f472b6"/><path d="M12 21l-2 3h4z" fill="#f472b6"/><path d="M12 24q-3 3 0 6" fill="none" stroke="#fff" stroke-width="1"/><ellipse cx="8" cy="7" rx="2" ry="3" fill="#fff" opacity=".5"/></svg>
    <svg class="dec cor" viewBox="0 0 24 24"><path fill="#f9a8d4" stroke="#be185d" stroke-width=".8" d="M12 21s-7-4.6-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.4-9.5 9-9.5 9z"/></svg>
    <h1>Pijamas <b>animados</b> para <b>soñar</b> en <b>grande</b></h1>
    <p>Los personajes que tus hijos aman, en prendas suaves y cómodas. Elegí tu modelo y consultanos por WhatsApp.</p>
  </div>
  <section class="cols" id="colecciones">
    <div class="colgrid" id="colgrid"></div>
  </section>
</main>

<main id="rubro" hidden>
  <div class="banner" id="banner">
    <nav class="catnav" id="catnav"></nav>
    <h1 id="rTitulo"></h1>
    <div id="filtros"></div>
  </div>
  <p class="cant" id="cant"></p>
  <div class="grid" id="grid"></div>
</main>

<footer><img src="pijamados.png" alt="Pijamados">@pijamadosok · Consultas por WhatsApp<span class="credito">Design by S.E.R.</span></footer>

<div id="modal"><button id="mx">&times;</button><button id="mp">‹</button><span class="mm"><img id="mi" alt="" draggable="false"></span><button id="mn">›</button></div>
<div id="promo"><div><button id="pc" aria-label="Cerrar">&times;</button><img id="pi" alt="Promoción"></div></div>
<div id="cv" hidden><div class="bar"><span id="cvt">Catálogo por pedido</span><button id="cvx" aria-label="Cerrar">&times;</button></div><div id="cvs"><div id="cvp"></div></div><a id="cvw" class="btn" target="_blank" rel="noopener">Hacer mi pedido por WhatsApp</a></div>

<script>
(() => {
  const WA = "5491159230739";
  const MOSTRAR_PRECIOS = false;   // true para volver a mostrar precios
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const ruta = n => /^https?:\/\//i.test(n) ? n : "img/" + n;
  const COLORES = ["--az", "--ro", "--ve", "--am"];
  const DEF = [{id:"pijamas",nombre:"Pijamas",genero:true,talles:true},{id:"remeras",nombre:"Remeras",genero:true,talles:true},{id:"mantas",nombre:"Mantas",genero:false,talles:false}];
  let P = [], R = DEF, ru = null, gen = "todos", tal = "todos", CAT = null;
  const FONDOS = {varon:["#93c5fd","#bfdbfe"],mujer:["#f9a8d4","#fbcfe8"],todos:["#bfdbfe","#bfdbfe"]};
  const fondo = g => { const [a, b] = FONDOS[g] || FONDOS.todos; const st = document.documentElement.style; st.setProperty("--d1", a); st.setProperty("--d2", b); };
  const rubroDe = p => p.rubro || "pijamas";
  const visibles = id => P.filter(p => rubroDe(p) === id && p.imagen && !p.agotado);
  const color = id => `var(${COLORES[Math.max(0, R.findIndex(r => r.id === id)) % 4]})`;
  $("navWa").href = `https://wa.me/${WA}?text=${encodeURIComponent("¡Hola! Quisiera hacer una consulta.")}`;

  function pintarHome() {
    document.title = "Pijamados | Pijamas animados";
    let h = R.map((r, i) => {
      return `<a class="col" style="--c:var(${COLORES[i % 4]})" href="#/${esc(r.id)}"><h3>${esc(r.nombre)}</h3><span class="ver">Ver colección →</span></a>`;
    }).join("");
    if (CAT) h += `<button class="col esp" id="tileCat"><span class="n">Pedidos especiales</span><h3>${esc(CAT.titulo || "Catálogo por pedido")}</h3><span class="ver">Ver catálogo →</span></button>`;
    $("colgrid").innerHTML = h;
    if (CAT) $("tileCat").onclick = abrirCat;
  }

  function chips(box, op, get, set, cl) {
    const w = document.createElement("div"); w.className = "chips";
    op.forEach(([v, t]) => {
      const b = document.createElement("button");
      b.className = "chip " + cl + (get() === v ? " on" : ""); b.dataset.v = v; b.textContent = t;
      b.onclick = () => { set(v); [...w.children].forEach(x => x.classList.toggle("on", x === b)); pintarProductos(); };
      w.appendChild(b);
    });
    box.appendChild(w);
  }

  function pintarRubro() {
    document.title = ru.nombre + " | Pijamados";
    $("rTitulo").textContent = ru.nombre;
    $("catnav").innerHTML = `<a class="cn home" href="#/">← Inicio</a>` + R.map((r, i) => `<a class="cn${r.id === ru.id ? " on" : ""}" style="--c:var(${COLORES[i % 4]})" href="#/${esc(r.id)}">${esc(r.nombre)}</a>`).join("") + (CAT ? `<button class="cn esp" type="button" id="cnCat">🎁 ${esc(CAT.titulo || "Catálogo por pedido")}</button>` : "");
    if (CAT) $("cnCat").onclick = abrirCat;
    $("banner").style.setProperty("--c", color(ru.id));
    const f = $("filtros"); f.innerHTML = "";
    if (ru.genero) chips(f, [["todos","Todos"],["varon","Varón"],["mujer","Mujer"]], () => gen, v => { gen = v; fondo(v); }, "g");
    if (ru.talles) {
      const ts = [...new Set(visibles(ru.id).flatMap(p => (p.talles || []).map(String)))].sort((a, b) => a - b);
      if (ts.length) chips(f, [["todos","Todos los talles"], ...ts.map(t => [t, "Talle " + t])], () => tal, v => tal = v, "t");
    }
    pintarProductos();
  }

  function pintarProductos() {
    let l = visibles(ru.id);
    if (ru.genero && gen !== "todos") l = l.filter(p => (p.categoria || "").toLowerCase() === gen);
    if (ru.talles && tal !== "todos") l = l.filter(p => (p.talles || []).map(String).includes(tal));
    $("cant").textContent = l.length ? `${l.length} ${l.length === 1 ? "modelo" : "modelos"}` : "";
    const grid = $("grid");
    grid.innerHTML = l.length ? "" : `<div class="vacio">No hay productos para este filtro todavía.</div>`;
    l.forEach(p => {
      const fotos = [p.imagen, ...(Array.isArray(p.galeria) ? p.galeria : [])].map(f => String(f).trim()).filter(Boolean);
      const nombre = String(p.nombre || "Producto").trim(), tl = (p.talles || []).map(String);
      const precio = typeof p.precio === "number" ? "$" + p.precio.toLocaleString("es-AR") : "$" + p.precio;
      const url = new URL(ruta(fotos[0]), location.href).href;
      const msg = encodeURIComponent(`¡Hola! Me interesa este producto:\n\n*${nombre}*\n` + (ru.talles ? `Talle: ${tl.join(", ") || "consultar"}\n` : "") + (MOSTRAR_PRECIOS ? `Precio: ${precio}\n` : "") + `Foto: ${url}`);
      const card = document.createElement("div"); card.className = "card";
      card.innerHTML = `<div class="img"><img src="${esc(ruta(fotos[0]))}" alt="${esc(nombre)}" loading="lazy">${fotos.length > 1 ? `<button class="nav prev" type="button">‹</button><button class="nav next" type="button">›</button><div class="dots">${fotos.map((_, k) => `<i${k ? "" : ' class="on"'}></i>`).join("")}</div>` : ""}</div>
      <div class="info"><h3>${esc(nombre)}</h3>${ru.talles && tl.length ? `<div class="tl">${tl.map(t => `<span>Talle ${esc(t)}</span>`).join("")}</div>` : ""}${MOSTRAR_PRECIOS ? `<div class="pr">${esc(precio)}</div>` : ""}<p>${esc(p.descripcion)}</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${msg}">Consultar por WhatsApp</a></div>`;
      let i = 0;
      const img = card.querySelector("img"), pts = card.querySelectorAll(".dots i");
      img.onerror = () => { if (!i) card.remove(); };
      const ir = d => { i = (i + d + fotos.length) % fotos.length; img.src = ruta(fotos[i]); pts.forEach((x, k) => x.classList.toggle("on", k === i)); };
      const pv = card.querySelector(".prev"), nx = card.querySelector(".next");
      if (pv) { pv.onclick = e => { e.stopPropagation(); ir(-1); }; nx.onclick = e => { e.stopPropagation(); ir(1); }; }
      card.querySelector(".img").onclick = () => abrir(fotos.map(ruta), i);
      grid.appendChild(card);
    });
  }

  function render() {
    const id = location.hash.replace(/^#\/?/, "").toLowerCase();
    ru = R.find(r => r.id === id) || null; gen = "todos"; tal = "todos"; fondo("todos");
    $("home").hidden = !!ru; $("rubro").hidden = !ru;
    ru ? pintarRubro() : pintarHome();
    scrollTo(0, 0);
  }
  addEventListener("hashchange", render);

  // Visor de fotos
  let gal = [], gi = 0, tx = null;
  const modal = $("modal");
  const mostrar = () => { $("mi").src = gal[gi]; $("mp").style.display = $("mn").style.display = gal.length > 1 ? "block" : "none"; };
  const abrir = (f, i) => { gal = f; gi = i; modal.style.display = "flex"; mostrar(); };
  const mover = d => { gi = (gi + d + gal.length) % gal.length; mostrar(); };
  $("mp").onclick = e => { e.stopPropagation(); mover(-1); };
  $("mn").onclick = e => { e.stopPropagation(); mover(1); };
  $("mx").onclick = () => modal.style.display = "none";
  modal.onclick = e => { if (e.target === modal) modal.style.display = "none"; };
  modal.addEventListener("touchstart", e => { tx = e.touches.length === 1 ? e.touches[0].clientX : null; }, {passive:true});
  modal.addEventListener("touchend", e => { if (tx === null || gal.length < 2) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) mover(d < 0 ? 1 : -1); tx = null; });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { modal.style.display = "none"; cerrarCat(); }
    if (modal.style.display === "flex") { if (e.key === "ArrowLeft") mover(-1); if (e.key === "ArrowRight") mover(1); }
  });

  // Catálogo por pedido (catalogo.json)
  let armado = false;
  function abrirCat() {
    if (!armado) {
      armado = true;
      $("cvp").innerHTML = CAT.paginas.map((n, i) => `<img src="img/${esc(n)}" alt="Catálogo, página ${i + 1}" draggable="false" ${i < 2 ? "" : 'loading="lazy"'}>`).join("");
    }
    $("cvt").textContent = CAT.titulo || "Catálogo por pedido";
    $("cvw").href = `https://wa.me/${WA}?text=${encodeURIComponent("¡Hola! Vi el catálogo por pedido y quiero hacer un pedido.")}`;
    $("cv").hidden = false; $("cvs").scrollTop = 0; document.body.style.overflow = "hidden";
  }
  function cerrarCat() { $("cv").hidden = true; document.body.style.overflow = ""; }
  $("cvx").onclick = cerrarCat;
  $("cv").addEventListener("contextmenu", e => { if (e.target.tagName === "IMG") e.preventDefault(); });

  // Promo emergente (promo.json), una vez por sesión
  $("pc").onclick = () => $("promo").style.display = "none";
  $("promo").onclick = e => { if (e.target === $("promo")) $("promo").style.display = "none"; };
  fetch("./promo.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(p => {
    if (!p || !p.activa || !p.imagen || (p.hasta && p.hasta < Date.now())) return;
    try { if (sessionStorage.getItem("promoVista") === String(p.id)) return; sessionStorage.setItem("promoVista", String(p.id)); } catch (e) {}
    $("pi").onload = () => $("promo").style.display = "flex";
    $("pi").src = ruta(p.imagen);
  }).catch(() => {});

  fetch("./catalogo.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(c => {
    if (c && c.activo && Array.isArray(c.paginas) && c.paginas.length) { CAT = c; if (!ru) pintarHome(); }
  }).catch(() => {});


  // Confeti al tocar botones y chips
  const confeti = e => {
    if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    const t = e.target.closest(".btn,.chip,.col"); if (!t) return;
    const cs = ["#ffd400","#e52713","#44aa3a","#0097dc","#ec4899","#fb923c"];
    for (let i = 0; i < 14; i++) {
      const d = document.createElement("i"); d.className = "cf";
      d.style.left = e.clientX + "px"; d.style.top = e.clientY + "px"; d.style.background = cs[i % cs.length];
      const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 70;
      d.style.setProperty("--dx", Math.cos(a) * r + "px"); d.style.setProperty("--dy", Math.sin(a) * r - 20 + "px"); d.style.setProperty("--r", Math.random() * 720 + "deg");
      document.body.appendChild(d); setTimeout(() => d.remove(), 1200);
    }
  };
  document.addEventListener("click", confeti);

  render();
  Promise.all([
    fetch("./products.json?t=" + Date.now()).then(r => { if (!r.ok) throw 0; return r.json(); }),
    fetch("./categorias.json?t=" + Date.now()).then(r => r.ok ? r.json() : DEF).catch(() => DEF)
  ]).then(([p, r]) => { P = p; if (Array.isArray(r) && r.length) R = r; render(); })
    .catch(() => $("colgrid").insertAdjacentHTML("afterend", `<p class="sub" style="margin-top:28px">No se pudo cargar el catálogo. Intentá de nuevo en un momento.</p>`));
})();
</script>
</body>
</html>
