<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pijamados | Catálogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #eef4ff;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --whatsapp-color: #10b981;
            --whatsapp-hover: #059669;
            --border-color: #e2e8f0;
            --header-bg: #1d4ed8;
            --amarillo: #fbbf24;

            /* Colores de fondo por categoría. Los cambia el JS al tocar cada botón */
            --dot-color-1: #93c5fd;
            --dot-color-2: #bfdbfe;
            --dot-pos-2: 13px 13px;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0 0 50px 0;
            background: var(--bg-color);
            color: var(--text-main);
            position: relative;
            min-height: 100vh;
        }

        /* PATRÓN DE FONDO TIPO CONFETI (cambia de color según género) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                radial-gradient(var(--dot-color-1) 3px, transparent 4px),
                radial-gradient(var(--dot-color-2) 3px, transparent 4px);
            background-size: 30px 30px, 30px 30px;
            background-position: 0 0, var(--dot-pos-2);
            opacity: 0.5;
            z-index: -1;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        body.cambiando-fondo::before { opacity: 0; }

        header {
            background: linear-gradient(135deg, #1d4ed8, #2563eb 60%, #3b82f6);
            padding: 18px 20px;
            text-align: center;
            margin-bottom: 26px;
            box-shadow: 0 4px 14px rgba(29, 78, 216, 0.25);
        }

        #logo { display: none; max-height: 100px; width: auto; margin: 0 auto; border-radius: 14px; }
        #logo.visible { display: inline-block; }

        h1 {
            margin: 0;
            font-family: 'Baloo 2', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        h1.oculto { display: none; }
        h1 span { color: var(--amarillo); }

        /* BARRA DE GÉNERO */
        .categorias {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto 16px;
            padding: 0 20px;
        }

        .cat-btn {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 10px 26px;
            border-radius: 999px;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cat-btn:hover { border-color: #93c5fd; color: #1d4ed8; }
        .cat-btn.activo { color: white; border-color: transparent; }
        .cat-btn.activo[data-cat="varon"] { background: #2563eb; }
        .cat-btn.activo[data-cat="mujer"] { background: #ec4899; }
        .cat-btn.activo[data-cat="todos"] { background: #7c3aed; }

        /* FILTROS SECUNDARIOS: talle y orden */
        .filtros-wrap {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 0 20px;
        }
        .filtro-item { display: flex; align-items: center; gap: 8px; }
        .filtro-item label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
        .filtro-item select {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 32px 8px 16px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--card-bg) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%2364748b"><path d="M5.5 7.5l4.5 4.5 4.5-4.5" stroke="%2364748b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 12px center;
            background-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        .filtro-item select:hover, .filtro-item select:focus { border-color: #2563eb; outline: none; }

        .barra-rubros { margin-bottom: 12px; }
        .cat-btn.rubro-btn { font-size: 1.1rem; }
        .cat-btn.rubro-btn.activo { background: #1d4ed8; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.1); }

        .card-image-wrapper {
            display: block; width: 100%; height: 220px; overflow: hidden;
            border-radius: 12px; margin-bottom: 15px; cursor: pointer;
            background-color: #f1f5f9; position: relative;
        }
        .card img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s ease; }
        .card-image-wrapper:hover img { transform: scale(1.06); }
        .foto-count-badge {
            position: absolute; bottom: 8px; right: 8px; background: rgba(15, 23, 42, 0.7);
            color: #fff; font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
        }

        .card h3 { font-size: 1.15rem; font-weight: 700; margin: 0 0 6px 0; color: var(--text-main); }

        .talles-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px 0; }
        .talle-chip {
            font-size: 0.75rem; font-weight: 700; color: #1d4ed8;
            background: #dbeafe; border-radius: 999px; padding: 3px 10px;
        }

        .price { font-weight: 800; color: #047857; font-size: 1.25rem; margin: 5px 0 10px 0; }

        .card p { font-size: 0.9rem; color: var(--text-muted); margin: 0 0 15px 0; line-height: 1.4; flex-grow: 1; }

        .btn-whatsapp {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--whatsapp-color); color: white; padding: 10px 15px;
            border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 0.9rem;
            transition: background 0.2s ease; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.25);
        }
        .btn-whatsapp:hover { background: var(--whatsapp-hover); }

        #error-msg {
            max-width: 600px; margin: 20px auto; background: #fee2e2; color: #991b1b;
            padding: 15px; border-radius: 8px; text-align: center; display: none; font-weight: 500;
        }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px); justify-content: center; align-items: center;
        }
        .modal-content { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 8px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        .close-btn {
            position: absolute; top: 25px; right: 30px; color: #fff; font-size: 35px; font-weight: 300;
            cursor: pointer; background: rgba(255, 255, 255, 0.1); width: 45px; height: 45px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s;
        }
        .close-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .modal-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            color: #fff; font-size: 28px; cursor: pointer; background: rgba(255, 255, 255, 0.12);
            width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; user-select: none;
        }
        .modal-arrow:hover { background: rgba(255, 255, 255, 0.25); }
        .modal-arrow.prev { left: 20px; }
        .modal-arrow.next { right: 20px; }
        .modal-counter {
            position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 0.85rem; font-weight: 600; background: rgba(255, 255, 255, 0.15);
            padding: 5px 14px; border-radius: 999px;
        }
    </style>
</head>
<body>

    <header>
        <img id="logo" alt="Pijamados">
        <h1 id="titulo-texto">PIJA<span>MADOS</span></h1>
    </header>

    <div class="categorias barra-rubros" id="barra-rubros"></div>
    <div class="categorias" id="barra-categorias"></div>
    <div class="filtros-wrap">
        <div class="filtro-item" id="filtro-talle">
            <label for="talle-select">Talle</label>
            <select id="talle-select">
                <option value="todos">Todos los talles</option>
                <option value="6">6</option>
                <option value="8">8</option>
                <option value="10">10</option>
                <option value="12">12</option>
                <option value="14">14</option>
                <option value="16">16</option>
            </select>
        </div>
        <div class="filtro-item">
            <label for="orden-select">Ordenar por</label>
            <select id="orden-select">
                <option value="defecto">Recomendado</option>
                <option value="nombre-asc">Nombre (A-Z)</option>
                <option value="precio-asc">Precio: menor a mayor</option>
                <option value="precio-desc">Precio: mayor a menor</option>
            </select>
        </div>
    </div>

    <div id="error-msg"></div>
    <div class="grid" id="catalogo-productos"></div>

    <div id="imageModal" class="modal">
        <span class="close-btn" id="closeModal">&times;</span>
        <span class="modal-arrow prev" id="modalPrev">&#8249;</span>
        <img class="modal-content" id="modalImg" alt="Imagen ampliada">
        <span class="modal-arrow next" id="modalNext">&#8250;</span>
        <span class="modal-counter" id="modalCounter"></span>
    </div>

    <script>
        (() => {
            const numeroWhatsApp = "5491100000000"; // <-- reemplazá por el número real
            const contenedor = document.getElementById("catalogo-productos");
            const barraCategorias = document.getElementById("barra-categorias");

            const NOMBRES_CATEGORIA = { varon: "Varón", mujer: "Mujer" };
            const ORDEN_CATEGORIAS = ["varon", "mujer"];

            // Confeti de fondo: dos colores por categoría (género)
            const FONDOS = {
                varon: ["#93c5fd", "#bfdbfe"],
                mujer: ["#f9a8d4", "#fbcfe8"],
                todos: ["#93c5fd", "#f9a8d4"],
            };

            const RUBROS_DEFAULT = [
                { id: "pijamas", nombre: "Pijamas", genero: true, talles: true },
                { id: "remeras", nombre: "Remeras", genero: true, talles: true },
                { id: "mantas", nombre: "Mantas", genero: false, talles: false },
            ];
            let RUBROS = RUBROS_DEFAULT;
            let PRODUCTOS = [];
            let rubroActivo = "pijamas";
            const barraRubros = document.getElementById("barra-rubros");
            const rubroActual = () => RUBROS.find(r => r.id === rubroActivo) || RUBROS[0];

            let categoriaActiva = "varon";
            let talleActivo = "todos";
            let ordenActivo = "defecto";

            function valorPrecio(prod) {
                const n = typeof prod.precio === "number"
                    ? prod.precio
                    : parseFloat(String(prod.precio).replace(/[^\d.-]/g, ""));
                return isNaN(n) ? null : n;
            }

            function ordenarLista(lista) {
                const copia = [...lista];
                if (ordenActivo === "nombre-asc") {
                    copia.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es", { sensitivity: "base" }));
                } else if (ordenActivo === "precio-asc" || ordenActivo === "precio-desc") {
                    copia.sort((a, b) => {
                        const va = valorPrecio(a), vb = valorPrecio(b);
                        if (va === null && vb === null) return 0;
                        if (va === null) return 1;
                        if (vb === null) return -1;
                        return ordenActivo === "precio-asc" ? va - vb : vb - va;
                    });
                }
                return copia;
            }

            function aplicarFondo(cat) {
                const [c1, c2] = FONDOS[cat] || FONDOS.todos;
                document.body.classList.add("cambiando-fondo");
                document.documentElement.style.setProperty("--dot-color-1", c1);
                document.documentElement.style.setProperty("--dot-color-2", c2);
                setTimeout(() => document.body.classList.remove("cambiando-fondo"), 10);
            }

            function pintarProductos(productos) {
                contenedor.innerHTML = "";
                const rb = rubroActual();
                let filtrados = productos.filter(p => (p.rubro || "pijamas") === rb.id);

                if (rb.genero && categoriaActiva !== "todos") {
                    filtrados = filtrados.filter(p => (p.categoria || "").toLowerCase() === categoriaActiva);
                }
                if (rb.talles && talleActivo !== "todos") {
                    filtrados = filtrados.filter(p => Array.isArray(p.talles) && p.talles.map(String).includes(talleActivo));
                }

                const visibles = ordenarLista(filtrados);

                if (visibles.length === 0) {
                    contenedor.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">No hay productos para este filtro todavía.</p>';
                    return;
                }

                visibles.forEach((prod) => {
                    if (!prod.imagen) return;
                    const imagen = String(prod.imagen).trim();
                    if (imagen === "" || imagen.toLowerCase() === "undefined" || imagen.toLowerCase() === "null") return;

                    const nombre = prod.nombre ? String(prod.nombre).trim() : 'Producto';
                    let precio = prod.precio !== undefined ? prod.precio : 'Consultar';
                    precio = typeof precio === 'number' ? '$' + precio.toLocaleString('es-AR') : '$' + precio;

                    const descripcion = prod.descripcion ? String(prod.descripcion).trim() : '';
                    const talles = Array.isArray(prod.talles) ? prod.talles : [];

                    const urlFoto = `${window.location.origin}${window.location.pathname.replace(/\/$/, '')}/img/${imagen}`;
                    const textoMensaje = encodeURIComponent(`Hola! Me interesa este producto:\n\n*${nombre}*\n${rb.talles ? `Talle: ${talles.join(', ') || 'consultar'}\n` : ''}Precio: ${precio}\nFoto: ${urlFoto}`);
                    const fotos = [imagen, ...(Array.isArray(prod.galeria) ? prod.galeria : [])];

                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="card-image-wrapper" title="Ampliar imagen">
                            <img src="img/${imagen}" alt="${nombre}" onerror="this.closest('.card').remove();">
                            ${fotos.length > 1 ? `<span class="foto-count-badge">📷 ${fotos.length}</span>` : ''}
                        </div>
                        <h3>${nombre}</h3>
                        ${rb.talles ? `<div class="talles-chips">${talles.map(t => `<span class="talle-chip">Talle ${t}</span>`).join('') || '<span class="talle-chip">Consultar talle</span>'}</div>` : ''}
                        <div class="price">${precio}</div>
                        <p>${descripcion}</p>
                        <a href="https://wa.me/${numeroWhatsApp}?text=${textoMensaje}" class="btn-whatsapp" target="_blank">
                            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                            Consultar por WhatsApp
                        </a>
                    `;
                    card.querySelector(".card-image-wrapper").onclick = () => abrirModal(fotos, 0);
                    contenedor.appendChild(card);
                });
            }

            function pintarRubros() {
                barraRubros.innerHTML = "";
                RUBROS.forEach((r) => {
                    const btn = document.createElement("button");
                    btn.className = "cat-btn rubro-btn" + (r.id === rubroActivo ? " activo" : "");
                    btn.textContent = r.nombre;
                    btn.onclick = () => {
                        rubroActivo = r.id;
                        categoriaActiva = r.genero ? "varon" : "todos";
                        talleActivo = "todos";
                        document.getElementById("talle-select").value = "todos";
                        pintarRubros();
                        pintarGenero();
                        pintarProductos(PRODUCTOS);
                    };
                    barraRubros.appendChild(btn);
                });
            }

            function pintarGenero() {
                const rb = rubroActual();
                document.getElementById("filtro-talle").style.display = rb.talles ? "" : "none";
                barraCategorias.innerHTML = "";
                if (!rb.genero) {
                    barraCategorias.style.display = "none";
                    aplicarFondo("todos");
                    return;
                }
                barraCategorias.style.display = "";
                aplicarFondo(categoriaActiva);
                ["varon", "mujer", "todos"].forEach((cat) => {
                    const btn = document.createElement("button");
                    btn.className = "cat-btn" + (cat === categoriaActiva ? " activo" : "");
                    btn.dataset.cat = cat;
                    btn.textContent = cat === "todos" ? "Todos" : NOMBRES_CATEGORIA[cat];
                    btn.onclick = () => {
                        categoriaActiva = cat;
                        [...barraCategorias.children].forEach(b => b.classList.remove("activo"));
                        btn.classList.add("activo");
                        aplicarFondo(cat);
                        pintarProductos(PRODUCTOS);
                    };
                    barraCategorias.appendChild(btn);
                });
            }

            (function cargarLogo() {
                const logo = document.getElementById("logo");
                const candidatos = ["logo.jpg", "img/logo.jpg", "logo.png", "img/logo.png"];
                let i = 0;
                const probar = () => {
                    if (i >= candidatos.length) return;
                    logo.onload = () => {
                        logo.classList.add("visible");
                        document.getElementById("titulo-texto").classList.add("oculto");
                    };
                    logo.onerror = () => { i++; probar(); };
                    logo.src = candidatos[i];
                };
                probar();
            })();

            const pedirRubros = fetch('./categorias.json?t=' + Date.now())
                .then(r => r.ok ? r.json() : RUBROS_DEFAULT)
                .catch(() => RUBROS_DEFAULT);

            Promise.all([
                fetch('./products.json?t=' + Date.now()).then(response => {
                    if (!response.ok) throw new Error("No se encontró el archivo products.json");
                    return response.json();
                }),
                pedirRubros,
            ])
                .then(([productos, rubros]) => {
                    PRODUCTOS = productos;
                    if (Array.isArray(rubros) && rubros.length) RUBROS = rubros;
                    rubroActivo = RUBROS[0].id;
                    categoriaActiva = RUBROS[0].genero ? "varon" : "todos";
                    pintarRubros();
                    pintarGenero();
                    pintarProductos(PRODUCTOS);
                    document.getElementById("orden-select").onchange = (e) => {
                        ordenActivo = e.target.value;
                        pintarProductos(PRODUCTOS);
                    };
                    document.getElementById("talle-select").onchange = (e) => {
                        talleActivo = e.target.value;
                        pintarProductos(PRODUCTOS);
                    };
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById("error-msg").style.display = "block";
                    document.getElementById("error-msg").innerText = "No se pudo cargar el catálogo. Intentá de nuevo en un momento.";
                });
        })();

        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImg");
        const closeModal = document.getElementById("closeModal");
        const modalPrev = document.getElementById("modalPrev");
        const modalNext = document.getElementById("modalNext");
        const modalCounter = document.getElementById("modalCounter");

        let fotosModal = [];
        let indiceModal = 0;

        function pintarFotoModal() {
            modalImg.src = "img/" + fotosModal[indiceModal];
            const varias = fotosModal.length > 1;
            modalPrev.style.display = varias ? "flex" : "none";
            modalNext.style.display = varias ? "flex" : "none";
            modalCounter.style.display = varias ? "block" : "none";
            modalCounter.textContent = `${indiceModal + 1} / ${fotosModal.length}`;
        }

        function abrirModal(fotos, indiceInicial) {
            fotosModal = Array.isArray(fotos) ? fotos : [fotos];
            indiceModal = indiceInicial || 0;
            modal.style.display = "flex";
            pintarFotoModal();
        }
        function fotoAnterior() { indiceModal = (indiceModal - 1 + fotosModal.length) % fotosModal.length; pintarFotoModal(); }
        function fotoSiguiente() { indiceModal = (indiceModal + 1) % fotosModal.length; pintarFotoModal(); }

        closeModal.onclick = function() { modal.style.display = "none"; }
        modal.onclick = function(event) { if (event.target === modal) modal.style.display = "none"; }
        modalPrev.onclick = function(e) { e.stopPropagation(); fotoAnterior(); }
        modalNext.onclick = function(e) { e.stopPropagation(); fotoSiguiente(); }
        document.addEventListener("keydown", function(e) {
            if (modal.style.display !== "flex") return;
            if (e.key === "Escape") modal.style.display = "none";
            if (e.key === "ArrowLeft") fotoAnterior();
            if (e.key === "ArrowRight") fotoSiguiente();
        });
    </script>

</body>
</html>
